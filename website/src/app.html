<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
		<script>
			// runs before paint so the stored theme applies without a flash
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark = stored
						? stored === 'dark'
						: matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
		</script>
		<link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
