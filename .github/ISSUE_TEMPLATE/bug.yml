name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mielwm version
      description: About mielwm in the menu bar shows it.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: mielwm's view of your windows
      description: The output of `mielwm --list-windows --json`, if it's relevant.
      render: json
