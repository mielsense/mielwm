name: Feature request
description: Something mielwm could do.
labels: [feature]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Elsewhere
      description: If AeroSpace or another app already does this, which one and how.
