name: Labeler

# pull_request_target, so pull requests from forks get labels too. It runs the
# base branch's workflow and config and checks out no code from the pull request.
on:
  pull_request_target:

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
