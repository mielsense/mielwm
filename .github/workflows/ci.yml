name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal" || true
      - name: Build
        run: swift build
      - name: Test
        # One process per test target, as with the Command Line Tools: in a single
        # process the render tests starve the system tests' main and utility queues.
        run: |
          swift build --build-tests
          for target in MielCoreTests MielRenderTests MielSystemTests; do
            swift test --skip-build --filter "$target"
          done
      - name: Build the app bundle
        run: scripts/build-app.sh

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
