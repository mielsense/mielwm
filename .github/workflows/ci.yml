name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push replaces a pull request's run. On main a run that started finishes,
  # but a newer push replaces one still waiting to start.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # true: any compiler warning fails the App job. Until then CI only lists them.
  WARNINGS_AS_ERRORS: true

jobs:
  app:
    name: App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal" || true
      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Warnings
        run: |
          grep -E ': warning: ' "$RUNNER_TEMP/build.log" | sort -u > "$RUNNER_TEMP/warnings.txt" || true
          count=$(wc -l < "$RUNNER_TEMP/warnings.txt" | tr -d ' ')
          echo "$count compiler warnings"
          cat "$RUNNER_TEMP/warnings.txt"
          echo "Compiler warnings: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ] && [ "$WARNINGS_AS_ERRORS" = true ]; then
            echo "::error::$count compiler warnings, and WARNINGS_AS_ERRORS is on"
            exit 1
          fi
      - name: Test
        # One process per test target, as with the Command Line Tools: in a single
        # process the render tests starve the system tests' main and utility queues.
        run: |
          for target in MielCoreTests MielRenderTests MielSystemTests; do
            swift test --skip-build --filter "$target"
          done
      - name: Build the app bundle
        # The same release build scripts/build-app.sh makes locally.
        run: scripts/build-app.sh

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between files and their #anchors. Offline, so a slow website never fails a pull request.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            './*.md' 'docs/**/*.md' 'decisions/*.md' '.github/**/*.md'
          fail: true
          jobSummary: true

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        # Dependabot can't update this pin: bump the version and its checksum together by hand.
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
